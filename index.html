<!DOCTYPE html>
<html lang="en" data-palette="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0C17">
<title>Sound drawing · دواير</title>
<style>
:root{--bg:#0B0C17;--fg:#E9DFC6;--dim:rgba(233,223,198,.55);--line:rgba(233,223,198,.16);--chip:rgba(11,12,23,.62);--on:#E9DFC6;--onfg:#0B0C17;--accent:#4FC1B9}
:root[data-palette=bone]{--bg:#EFE7D8;--fg:#1B1A17;--dim:rgba(27,26,23,.55);--line:rgba(27,26,23,.16);--chip:rgba(239,231,216,.72);--on:#1B1A17;--onfg:#EFE7D8;--accent:#C8431F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;touch-action:manipulation;
  font:15px/1.35 ui-sans-serif,system-ui,-apple-system,"SF Arabic","Segoe UI",sans-serif}
#view{position:fixed;inset:0;display:block}
.chrome{position:fixed;left:0;right:0;display:flex;justify-content:center;gap:8px;padding:0 12px;transition:opacity .6s ease;pointer-events:none}
.chrome>*{pointer-events:auto}
body.idle .chrome{opacity:0}
body.idle .chrome>*{pointer-events:none}
.top{top:max(12px,env(safe-area-inset-top));justify-content:space-between;align-items:flex-start}
.bottom{bottom:max(14px,env(safe-area-inset-bottom));flex-wrap:wrap}
#status{font:500 12px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;color:var(--dim);padding:10px 4px;max-width:40vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lenses{display:flex;border:1px solid var(--line);border-radius:999px;background:var(--chip);padding:3px}
#lenses button{border:0;background:none;color:var(--dim);border-radius:999px;padding:6px 14px 5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:64px}
#lenses button b{font:500 19px/1.1 "SF Arabic","Geeza Pro",system-ui,sans-serif}
#lenses button i{font:500 9.5px/1.4 ui-monospace,Menlo,monospace;font-style:normal;letter-spacing:.14em;text-transform:uppercase}
#lenses button[aria-pressed=true]{background:var(--on);color:var(--onfg)}
.spacer{width:40vw;max-width:140px}
.btn{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;min-height:42px;padding:0 16px;font:500 14px/1 inherit;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn input{display:none}
.btn.icon{width:42px;padding:0;justify-content:center}
.btn.main{background:var(--on);color:var(--onfg);border-color:var(--on)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#0B0C17}
.btn[aria-pressed=false]{color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
#caption{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(14px,env(safe-area-inset-bottom)) + 64px);width:min(92vw,640px);text-align:center;
  opacity:0;transition:opacity 1.2s ease;pointer-events:none}
#caption.on{opacity:1}
#capAr{display:block;font:500 17px/1.5 "SF Arabic","Geeza Pro",system-ui,sans-serif;direction:rtl}
#capEn{display:block;font:400 13.5px/1.4 ui-sans-serif,system-ui,sans-serif;color:var(--dim);margin-top:2px}
body.idle #caption{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 8px)}
@media (max-width:620px){
  .top{flex-direction:column;align-items:center;gap:2px}
  .spacer{display:none}
  #status{order:2;max-width:90vw;padding:6px 4px;font-size:11px}
  #lenses button{min-width:58px;padding:6px 11px 5px}
  .btn{padding:0 13px;min-height:42px}.btn.icon{width:42px}
  .bottom{gap:6px}
}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="chrome top">
  <div id="status">Sound drawing</div>
  <div id="lenses" role="group" aria-label="Lens">
    <button data-lens="dawayer" aria-pressed="true"><b>دواير</b><i>Dawayer</i></button>
    <button data-lens="qalam" aria-pressed="false"><b>قلم</b><i>Qalam</i></button>
    <button data-lens="daw" aria-pressed="false"><b>ضوء</b><i>Daw'</i></button>
  </div>
  <div class="spacer"></div>
</div>
<div id="caption" aria-live="polite"><span id="capAr"></span><span id="capEn"></span></div>
<div class="chrome bottom">
  <button class="btn main" id="micBtn"><span class="dot"></span>Listen</button>
  <label class="btn">Open<input type="file" id="fileIn" accept="audio/*,.m4a,.wav,.mp3,.aac"></label>
  <button class="btn" id="playBtn" hidden>Play</button>
  <button class="btn icon" id="paletteBtn" aria-label="Palette"><svg viewBox="0 0 20 20" width="18" height="18"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 2.5a7.5 7.5 0 0 1 0 15z" fill="currentColor"/></svg></button>
  <button class="btn icon" id="capBtn" aria-pressed="true" aria-label="Captions" title="Captions"><span style="font-size:18px;line-height:1">؟</span></button>
  <button class="btn icon" id="saveBtn" aria-label="Save the drawing" title="Save the drawing"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v9M6 8.5l4 4 4-4M4 15.5h12"/></svg></button>
  <button class="btn icon" id="clearBtn" aria-label="Clear the paper" title="Clear the paper"><svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
</div>
<script src="listen.js"></script>
<script src="lenses.js"></script>
<script src="app.js"></script>
</body>
</html>
